name: Downloadable Cling archives
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: windows
        options: [windows, linux, all]
  push:
    branches: [master, ci/binary-packages]

permissions:
  contents: read

concurrency:
  group: binary-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform == 'windows' && '[{"runner": "windows-2022", "target": "windows11-x86_64", "jobs": 2}]' || inputs.platform == 'linux' && '[{"runner": "ubuntu-26.04", "target": "ubuntu26.04-x86_64", "jobs": 3}]' || '[{"runner": "windows-2022", "target": "windows11-x86_64", "jobs": 2}, {"runner": "ubuntu-26.04", "target": "ubuntu26.04-x86_64", "jobs": 3}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable long dependency paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Read pinned LLVM revision
        id: llvm
        run: |
          $lock = Get-Content tools/binary-packages/llvm.lock.json -Raw | ConvertFrom-Json
          "repository=$($lock.repository)" >> $env:GITHUB_OUTPUT
          "revision=$($lock.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.llvm.outputs.repository }}
          ref: ${{ steps.llvm.outputs.revision }}
          path: _llvm
          sparse-checkout: |
            llvm
            clang
            cmake
            third-party
      - name: Initialize x64 MSVC
        if: runner.os == 'Windows'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC x64 tools not found" }
          & cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment setup failed" }
      - name: Install build tools
        run: python -m pip install "cmake>=3.31,<4" ninja
      - name: Configure
        run: |
          New-Item -ItemType Directory -Force _evidence | Out-Null
          $flags = @(
            "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_POLICY_VERSION_MINIMUM=3.10",
            "-DLLVM_EXTERNAL_PROJECTS=cling", "-DLLVM_EXTERNAL_CLING_SOURCE_DIR=$env:GITHUB_WORKSPACE",
            "-DLLVM_ENABLE_PROJECTS=clang", "-DLLVM_TARGETS_TO_BUILD=X86",
            "-DLLVM_ENABLE_ASSERTIONS=OFF", "-DLLVM_INCLUDE_TESTS=OFF",
            "-DLLVM_INCLUDE_BENCHMARKS=OFF", "-DCLING_INCLUDE_TESTS=OFF",
            "-DLLVM_ENABLE_ZLIB=OFF", "-DLLVM_ENABLE_ZSTD=OFF",
            "-DLLVM_ENABLE_LIBXML2=OFF", "-DLLVM_ENABLE_LIBEDIT=OFF",
            "-DLLVM_ENABLE_TERMINFO=OFF", "-DLLVM_USE_CRT_RELEASE=MD",
            "-DLLVM_ENABLE_PIC=ON"
          )
          if ($IsLinux) {
            $flags += '-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON'
            $flags += '-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib'
          }
          cmake -S _llvm/llvm -B _build -G Ninja @flags 2>&1 | Tee-Object _evidence/configure.log
          if ($LASTEXITCODE -ne 0) { throw "Configure failed: $LASTEXITCODE" }
      - name: Build interpreter and embedding libraries
        run: |
          cmake --build _build --parallel ${{ matrix.jobs }} --target cling libcling clang-resource-headers 2>&1 | Tee-Object _evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
      - name: Create downloadable archive
        run: |
          python -u tools/binary-packages/package.py --llvm _llvm --build _build --target ${{ matrix.target }} 2>&1 | Tee-Object _evidence/package.log
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed: $LASTEXITCODE" }
      - name: Upload downloadable archive
        uses: actions/upload-artifact@v4
        with:
          name: cling-${{ matrix.target }}-${{ github.sha }}
          path: |
            _packages/*.zip
            _packages/*.tar.gz
            _packages/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Validate packaged runtime (advisory)
        id: validation
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -u tools/binary-packages/package.py --llvm _llvm --build _build --target ${{ matrix.target }} --validate-only 2>&1 | Tee-Object _evidence/validation.log
          if ($LASTEXITCODE -ne 0) { throw "Runtime validation failed: $LASTEXITCODE; archive remains available" }
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.target }}-${{ github.sha }}
          path: |
            _evidence/
            _build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Report runtime validation
        if: always()
        run: |
          "Runtime validation: ${{ steps.validation.outcome }}. Archive publication is independent of this result; check validation logs before relying on the package." >> $env:GITHUB_STEP_SUMMARY


  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cling-*-${{ github.sha }}
          path: downloads
          merge-multiple: true
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_id }}" downloads/* --target "${{ github.sha }}" --title "Cling ${{ inputs.platform || 'all platforms' }} (${{ github.run_number }})" --prerelease --notes "Development archives for the selected platforms. Runtime tests are advisory and may fail; compilation does not establish runtime correctness. Inspect validation evidence at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Kit GPU integration is not validated."
